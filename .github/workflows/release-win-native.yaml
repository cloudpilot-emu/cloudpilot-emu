name: Build and release native Windows binaries
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG: ${GITHUB_REF##*/}
  ARCHIVE: cloudpilot-win-native-${GITHUB_REF##*/}.zip
jobs:
  wait-for-release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release to be created
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-name: Create release
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
  build-and-upload:
    runs-on: ubuntu-latest
    needs: wait-for-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Build MinGW binaries (x86 + x64)
        run: >
          docker buildx build -f Dockerfile.build-mingw --target artifacts
          --output type=local,dest=out
          --cache-from type=gha .
      - name: Zip and upload
        run: |
          cd out
          zip -r ../${{ env.ARCHIVE }} .
          cd ..
          gh release upload ${{ env.TAG }} ${{ env.ARCHIVE }}
