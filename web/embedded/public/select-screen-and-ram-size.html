<html>
    <head>
        <script src="cloudpilot-emu.js"></script>

        <style>
            body {
                background-color: #eee;
            }

            .container {
                width: 100vw;
                overflow: hidden;
                height: calc(100vh - 8em);
                margin-bottom: 1em;

                display: flex;
                flex-direction: row;
            }

            #canvas-wrapper {
                flex-grow: 1;
                max-width: 60em;
            }

            canvas {
                width: 100%;
                height: 100%;
                visibility: hidden;
            }

            canvas:focus {
                border: none;
                outline: none;
            }

            #control-container {
                flex-grow: 0;
                flex-shrink: 0;
                flex-basis: 30em;
                text-align: left;
                margin-left: 0.5em;
            }

            body {
                text-align: center;
            }

            button {
                min-width: 10em;
                margin: 0.5em;
                margin-left: 0;
            }

            a {
                margin: 0 0.5em;
            }

            label {
                display: block;
            }

            select {
                min-width: 10em;
            }
        </style>
    </head>

    <body>
        <h1>Switch sessions</h1>
        <div class="container">
            <div id="canvas-wrapper"><canvas tabindex="1"></canvas></div>
            <div id="control-container" class="hidden">
                <div>
                    <label for="select-ram">RAM size:</label>
                    <select id="select-ram">
                        <option value="8">8MB</option>
                        <option value="16">16MB</option>
                        <option value="32" selected>32MB</option>
                        <option value="64">64MB</option>
                        <option value="128">128MB</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="select-screen-size">Screen size:</label>
                    <select id="select-screen-size">
                        <option value="160x160">160x160</option>
                        <option value="160x220">160x220</option>
                        <option value="240x240">240x240</option>
                        <option value="240x320">240x320</option>
                        <option value="320x320" selected>320x320</option>
                        <option value="320x480">320x480</option>
                        <option value="480x480">480x480</option>
                        <option value="480x720">480x720</option>
                    </select>
                </div>
            </div>
        </div>

        <a href="index.html">...back to index</a>
        <span id="enable-audio">
            |
            <a href="javascript://" id="enable-audio-link">enable audio</a>
        </span>
        |
        <a href="https://github.com/cloudpilot-emu/cloudpilot-emu/blob/master/web/embedded/public/switch-session_os5.html">
            source on github
        </a>

        <script>
            (async function () {
                const emulator = await cloudpilot.createEmulator({preloadUarm: true});

                const romResponse = await fetch('repalm_pv.bin.gz');
                if (!romResponse.ok) {
                    throw new Error('could not download rom image');
                }

                const rom = new Uint8Array(
                    await new Response(romResponse.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()
                );
                const canvas = document.getElementsByTagName('canvas')[0];

                const selectRam = document.getElementById('select-ram');
                const selectScreenSize = document.getElementById('select-screen-size');

                const enableAudio = document.getElementById('enable-audio');
                const enableAudioLink = document.getElementById('enable-audio-link');

                const handler = () => emulator.initializeAudio().then(() => {
                    enableAudioLink.removeEventListener('click', handler);
                    enableAudio.style.display = 'none';
                })

                enableAudioLink.addEventListener('click', handler);

                emulator.setCanvas(canvas);
                emulator.bindInput(canvas);

                function switchSession() {
                    const screenSize = selectScreenSize.value;
                    const ramSize = parseInt(selectRam.value, 10);

                    emulator
                        .loadRom(rom, undefined, undefined, ramSize, screenSize)
                        .then(() => emulator.resume())
                        .then(() => canvas.style.visibility = 'visible')
                        .catch(e => console.error(e));
                }

                [selectRam, selectScreenSize].forEach(elt => elt.addEventListener('change', switchSession));

                switchSession();
            })().catch((e) => console.error(e));
        </script>
    </body>
</html>
